# Builds the public qqCampWebDev Wiki and publishes it on GitHub Pages.
#
# This workflow lives only in this public repository. The rest of it is
# filled by publish.sh (or build.sh) from references/WiKi/ in the camp
# project, which never overwrites .github/: edit this file here.
#
# Runs on every push to main, and by hand from the Actions tab (Run
# workflow). One-time setup in the public repository:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# @author Springmoh
name: Wiki

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push does not cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"    # Sphinx 9.2 needs Python 3.13+
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Sphinx (pinned in requirements.txt)
        run: pip install -r requirements.txt

      - name: Build the public wiki
        run: |
          sphinx-build -b html -t public --keep-going source _site
          touch _site/.nojekyll

      - name: Check nothing private got in
        run: |
          test ! -e _site/operations && test ! -e _site/reports && test ! -e _site/developer/readme.html
          if grep -rIl -e 'cloudflared' -e '/home/' _site --include='*.html'; then
            echo "::error::a private page or path ended up in the public wiki"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
